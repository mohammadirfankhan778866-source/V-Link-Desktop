name: Build V-Link Windows Desktop Installer (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Package Windows Desktop Setup (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup and NSIS
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup and NSIS..."
          choco install innosetup --yes --no-progress
          choco install nsis --yes --no-progress
          
          # Add to GITHUB_PATH
          @("C:\Program Files (x86)\Inno Setup 6", "C:\Program Files\Inno Setup 6", "C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") | ForEach-Object {
            if (Test-Path $_) {
              Write-Host "Adding to PATH: $_"
              $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Prepare Staging and Distribution Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\V-Link" | Out-Null
          New-Item -ItemType Directory -Force -Path "windows\Output" | Out-Null
          
          @"
          V-Link Desktop Client for Windows
          Version: 1.0.0
          Platform: Windows 10 / Windows 11 (x64)
          Security: End-to-End Encrypted (Signal Protocol)
          Features: Dual-Pane Chat, Erlang Clustering, System Tray, Desktop Shortcuts
          Build Timestamp: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          "@ | Out-File -FilePath "dist\V-Link\app_info.txt" -Encoding utf8
          
          if (Test-Path "app\src\main\res") {
            Copy-Item -Path "app\src\main\res" -Destination "dist\V-Link\res" -Recurse -Force
          }
          
          Copy-Item -Path "windows\version.json" -Destination "dist\V-Link\version.json" -Force
          Copy-Item -Path "windows\app.ico" -Destination "dist\V-Link\app.ico" -Force

      - name: Compile Native Zero-Dependency V-Link.exe Executable
        shell: pwsh
        run: |
          Write-Host "=== Compiling native V-Link.exe with embedded App Icon and Zero External Runtime Dependencies ==="
          $outExe = "dist\V-Link\V-Link.exe"
          
          # Priority 1: Windows Built-In .NET Framework compiler (C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe)
          # Pre-installed on 100% of Windows 10 & 11 PCs - never prompts the user for any .NET runtime!
          $csc = Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64\v4.0.*", "C:\Program Files\Microsoft Visual Studio\*" -Filter "csc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($csc -and (Test-Path $csc)) {
            Write-Host "Compiling native zero-dependency V-Link.exe using in-box Windows compiler: $csc"
            & $csc /target:winexe /win32icon:windows\app.ico /out:$outExe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "windows\VLinkLauncher.cs"
            if (Test-Path $outExe) {
              Write-Host "Native in-box V-Link.exe successfully compiled!"
            }
          }
          
          # Priority 2: dotnet publish with --self-contained true (Bundles everything, zero runtime prompt!)
          if (-not (Test-Path $outExe)) {
            Write-Host "Compiling via dotnet publish with self-contained bundle..."
            dotnet publish windows\VLinkLauncher.csproj -c Release -r win-x64 --self-contained true -o "dist\V-Link"
          }
          
          # Priority 3: PowerShell Add-Type fallback
          if (-not (Test-Path $outExe)) {
            Write-Host "Falling back to Add-Type compilation..."
            Add-Type -TypeDefinition (Get-Content "windows\VLinkLauncher.cs" -Raw) -OutputAssembly $outExe -OutputType WindowsGUI -ReferencedAssemblies "System.Windows.Forms","System.Drawing"
          }
          
          if (-not (Test-Path $outExe)) {
            throw "Failed to compile V-Link.exe binary!"
          }
          
          Copy-Item -Path $outExe -Destination "dist\V-Link.exe" -Force
          Write-Host "V-Link.exe successfully created:"
          Get-Item $outExe | Format-List Length, FullName

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              throw "Inno Setup Compiler (ISCC.exe) not found."
            }
          } else {
            $isccPath = $iscc.Source
          }
          
          Write-Host "Compiling Inno Setup with: $isccPath"
          & $isccPath windows\vlink_setup.iss

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($null -ne $makensis) {
            $nsisPath = $makensis.Source
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
            $nsisPath = "C:\Program Files\NSIS\makensis.exe"
          } else {
            $nsisPath = $null
          }
          
          if ($nsisPath) {
            Write-Host "Compiling NSIS with: $nsisPath"
            & $nsisPath windows\vlink_installer.nsi
          } else {
            Write-Host "makensis not found, skipping NSIS build (Inno Setup is primary)."
          }

      - name: Verify Installer Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path "windows\Output" -Recurse
          if (-not (Test-Path "windows\Output\V-Link-Setup-1.0.0.exe")) {
            throw "Installer windows/Output/V-Link-Setup-1.0.0.exe was not created!"
          }
          Write-Host "Installer created successfully with embedded desktop and shortcut logos!"

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: V-Link-Windows-Installer-v1.0.0
          path: windows/Output/V-Link-Setup-1.0.0.exe
          if-no-files-found: error

name: Build V-Link Windows Desktop Installer (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Package Windows Desktop Setup (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup and NSIS Compilers
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          choco install nsis --yes --no-progress
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            echo "C:\Program Files\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Program Files\NSIS") {
            echo "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Prepare Windows Desktop Distribution Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\V-Link"
          New-Item -ItemType Directory -Force -Path "windows\Output"
          
          # Create Desktop metadata and configuration
          @"
          V-Link Desktop Client for Windows
          Version: 1.0.0
          Platform: Windows 10 / Windows 11 (x64)
          Security: End-to-End Encrypted (Signal Protocol)
          Features: Dual-Pane Chat, Erlang Clustering, System Tray, Desktop Shortcuts
          Build Timestamp: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          "@ | Out-File -FilePath "dist\V-Link\app_info.txt" -Encoding utf8
          
          # Copy desktop resources and assets into distribution bundle
          if (Test-Path "app\src\main\res") {
            Copy-Item -Path "app\src\main\res" -Destination "dist\V-Link\res" -Recurse -Force
          }
          
          # Copy version metadata
          Copy-Item -Path "windows\version.json" -Destination "dist\V-Link\version.json" -Force

      - name: Compile Native V-Link.exe Binary
        shell: pwsh
        run: |
          Write-Host "=== Compiling native V-Link.exe ==="
          
          # 1. First try Roslyn CSC directly
          $cscPath = Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64\v4.0.*", "C:\Program Files\Microsoft Visual Studio\*" -Filter "csc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          
          $compiled = $false
          if ($cscPath -and (Test-Path $cscPath)) {
            Write-Host "Using CSC at: $cscPath"
            & $cscPath /target:winexe /out:"dist\V-Link\V-Link.exe" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "windows\VLinkLauncher.cs"
            if (Test-Path "dist\V-Link\V-Link.exe") {
              $compiled = $true
              Write-Host "CSC build succeeded!"
            }
          }
          
          # 2. Fallback to dotnet publish
          if (-not $compiled) {
            Write-Host "Using dotnet publish..."
            dotnet publish windows\VLinkLauncher.csproj -c Release -r win-x64 --self-contained false -o "dist\V-Link"
            if (Test-Path "dist\V-Link\V-Link.exe") {
              $compiled = $true
              Write-Host "dotnet publish succeeded!"
            }
          }
          
          # 3. Fallback to Add-Type in PowerShell
          if (-not (Test-Path "dist\V-Link\V-Link.exe")) {
            Write-Host "Using Add-Type compilation..."
            Add-Type -TypeDefinition (Get-Content "windows\VLinkLauncher.cs" -Raw) -OutputAssembly "dist\V-Link\V-Link.exe" -OutputType WindowsGUI -ReferencedAssemblies "System.Windows.Forms","System.Drawing"
          }
          
          # Copy to root dist
          Copy-Item -Path "dist\V-Link\V-Link.exe" -Destination "dist\V-Link.exe" -Force -ErrorAction SilentlyContinue
          
          Write-Host "Binary verification:"
          Get-ChildItem -Path "dist\V-Link"

      - name: Compile Inno Setup Script into Installer Executable
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              throw "ISCC.exe compiler not found in system paths."
            }
          } else {
            $isccPath = $iscc.Source
          }
          
          Write-Host "Compiling Windows Installer with: $isccPath"
          & $isccPath windows\vlink_setup.iss

      - name: Compile NSIS Installer Executable
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($null -ne $makensis) {
            & $makensis.Source windows\vlink_installer.nsi
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" windows\vlink_installer.nsi
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
            & "C:\Program Files\NSIS\makensis.exe" windows\vlink_installer.nsi
          }

      - name: Verify Installer Executable Exists
        shell: pwsh
        run: |
          Get-ChildItem -Path "windows\Output" -Recurse
          if (-not (Test-Path "windows\Output\V-Link-Setup-1.0.0.exe")) {
            throw "Installer executable windows/Output/V-Link-Setup-1.0.0.exe was not generated!"
          }

      - name: Publish Windows Setup (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: V-Link-Windows-Installer-v1.0.0
          path: windows/Output/*.exe
          if-no-files-found: error
